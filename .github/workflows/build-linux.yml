name: Build Linux Launcher

on:
  workflow_dispatch:
  push:
    paths:
      - 'tenebra_launcher.py'
      - '.github/workflows/build-linux.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies (GTK + WebKit per pywebview)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.0 \
            libgtk-3-0 \
            libgirepository1.0-dev \
            pkg-config

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pywebview[gtk] pyinstaller PyGObject

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --name TenebraLauncher --collect-all pywebview --collect-all webview tenebra_launcher.py

      - name: Verify binary
        run: |
          ls -lh dist/
          file dist/TenebraLauncher
          chmod +x dist/TenebraLauncher

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          files: dist/TenebraLauncher
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_unmatched_files: true
